# Cada push a main copia el juego dentro del repo de la web "ellos" (AlexAvila02/3llos),
# en pages/juegos/kisukedreemurr. Netlify publica la web sola al recibir ese commit.
#
# Requiere un secreto ELLOS_TOKEN en este repo (Settings > Secrets and variables > Actions):
# un token de GitHub con permiso "Contents: Read and write" sobre AlexAvila02/3llos.
name: Sincronizar con ellos

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'sounds/**'
      - '.github/workflows/sync-ellos.yml'
  workflow_dispatch:

concurrency:
  group: sync-ellos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar token
        env:
          TOKEN: ${{ secrets.ELLOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto ELLOS_TOKEN (token con escritura en AlexAvila02/3llos)."
            exit 1
          fi

      - name: Bajar el juego
        uses: actions/checkout@v4
        with:
          path: juego

      - name: Bajar la web ellos
        uses: actions/checkout@v4
        with:
          repository: AlexAvila02/3llos
          token: ${{ secrets.ELLOS_TOKEN }}
          path: ellos

      - name: Copiar archivos del juego
        run: |
          DEST=ellos/pages/juegos/kisukedreemurr
          mkdir -p "$DEST"
          cp juego/index.html "$DEST/index.html"
          for d in css js sounds; do
            rsync -a --delete "juego/$d/" "$DEST/$d/"
          done

      - name: Commit y push a ellos
        working-directory: ellos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/juegos/kisukedreemurr
          if git diff --cached --quiet; then
            echo "Sin cambios en el juego."
            exit 0
          fi
          git commit -m "chore: actualizar kisukedreemurr (${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
